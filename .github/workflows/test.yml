name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: ctxmon suite
        run: python plugins/ctxmon/tests/test_ctxmon.py

      - name: every module imports and compiles
        run: |
          python -m py_compile plugins/ctxmon/ctxmon.py plugins/ipc/ipc.py plugins/ipc/relay.py tools/build_bundle.py install.py

      - name: bundle is not stale
        run: python tools/build_bundle.py --check

      - name: manifests are valid JSON and agree with each other
        run: python tools/check_manifests.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the wrappers
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh plugins/ctxmon/bin/ctxmon plugins/ipc/bin/ipc
          shellcheck -s bash plugins/ctxmon/statusline.sh
